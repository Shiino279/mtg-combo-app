<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shiinos Combis</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #020617, #0f172a);
  color: white;
  text-align: center;
}

/* Titel */
h1 {
  margin-top: 40px;
  font-size: 40px;
  letter-spacing: 2px;
  color: #f59e0b;
}

/* Untertitel */
p {
  color: #94a3b8;
}

/* Container */
.container {
  display: flex;
  justify-content: center;
  margin-top: 60px;
}

/* CARD */
.card {
  width: 300px;
  height: 420px;
  perspective: 1000px;
}

.inner-card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s;
}

/* Hover Flip */
.card:hover .inner-card {
  transform: rotateY(180deg);
}

/* Vorder & Rückseite */
.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 16px;
  overflow: hidden;
  backface-visibility: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

/* Vorderseite */
.front {
  background: #1e293b;
}

.front img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Rückseite */
.back {
  background: linear-gradient(135deg, #7c2d12, #1e293b);
  transform: rotateY(180deg);

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* Text Rückseite */
.back h2 {
  font-size: 28px;
  color: #f97316;
}

.back p {
  font-size: 18px;
}

/* Glow Effekt */
.card:hover {
  box-shadow: 0 0 25px rgba(249,115,22,0.6);
}
</style>

</head>

<body>

<h1>🔥 Shiinos Combis 🔥</h1>
<p>Meine persönlichen Magic Kombos</p>

<div class="container">

  <div class="card">
    <div class="inner-card">

      <!-- Vorderseite -->
      <div class="front">
        <img src="https://uploads3.wikiart.org/images/noartist/firelord-azula-avatar-the-last-airbender.jpg" alt="Azula">
      </div>

      <!-- Rückseite -->
      <div class="back">
        <h2>🔥 Azula Deck 🔥</h2>
        <p>Combos im Deck:</p>
        <h2>7</h2>
      </div>

    </div>
  </div>

</div>

</body>
</html>
