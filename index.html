<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Combo Finder</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1e293b, #020617);
  color: white;
}

/* HEADER */
header {
  text-align: center;
  padding: 30px;
  font-size: 36px;
  font-weight: bold;
  background: linear-gradient(90deg, #22c55e, #4f46e5);
  -webkit-background-clip: text;
  color: transparent;
}

/* SEARCH */
.search-box {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 20px;
}

input {
  padding: 14px;
  border-radius: 12px;
  border: none;
  width: 260px;
  font-size: 16px;
  background: #0f172a;
  color: white;
  outline: none;
  box-shadow: 0 0 10px rgba(34,197,94,0.3);
}

button {
  padding: 14px 22px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #22c55e, #4f46e5);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(34,197,94,0.7);
}

/* CONTAINER */
.container {
  max-width: 950px;
  margin: auto;
  padding: 20px;
}

/* CARD */
.card {
  margin-top: 20px;
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  background: rgba(15, 23, 42, 0.6);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  transition: 0.3s;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #22c55e, #4f46e5);
  opacity: 0;
  transition: 0.3s;
}

.card:hover::before {
  opacity: 0.1;
}

.card:hover {
  transform: translateY(-6px);
}

/* TITLES */
.title {
