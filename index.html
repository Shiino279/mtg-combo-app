<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  margin: 0;
  text-align: center;
}

input {
  padding: 10px;
  margin-top: 20px;
  width: 250px;
}

#suggestions {
  background: #1e293b;
  width: 250px;
  margin: auto;
}

.suggestion {
  padding: 8px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

.card {
  margin: 20px;
  background: #1e293b;
  padding: 15px;
}
</style>
</head>

<body>

<h1>🧙 MTG Finder</h1>

<input id="search" placeholder="Karte suchen..." oninput="autoComplete()">
<div id="suggestions"></div>

<div id="result"></div>

<script>
function autoComplete() {
  let q = document.getElementById("search").value;

  if (q.length < 2) return;

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + q)
    .then(res => res.json())
    .then(data => {
      let box = document.getElementById("suggestions");
      box.innerHTML = "";

      data.data.forEach(name => {
        box.innerHTML += `<div class="suggestion" onclick="loadCard('${name}')">${name}</div>`;
      });
    });
}

function loadCard(name) {
  document.getElementById("suggestions").innerHTML = "";

  fetch("https://api.scryfall.com/cards/named?fuzzy=" + name)
    .then(res => res.json())
    .then(card => {
      document.getElementById("result").innerHTML = `
        <div class="card">
          <h2>${card.name}</h2>
          <img src="${card.image_uris.normal}" width="200rd.type_line}</p>
          <p>${card.oracle_text || ""}</p>
        </div>
      `;
    });
}
</script>

</body>
</html>
