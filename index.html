<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Combo Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

input {
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

#suggestions {
  width: 260px;
  margin: auto;
  background: #1e293b;
  border-radius: 8px;
}

.suggestion {
  padding: 10px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

.card {
  background: #1e293b;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}

.combo {
  background: #1e293b;
  margin: 10px auto;
  padding: 12px;
  border-radius: 10px;
  max-width: 500px;
  border: 1px solid #334155;
}
</style>

</head>
<body>

<h1>🧙 MTG Combo Finder</h1>

<input id="search" placeholder="Karte suchen...">
<div id="suggestions"></div>

<div id="result"></div>
<div id="combos"></div>

<script>

// ✅ COMBO DATENBANK
const combos = [
  {
    name: "Heliod + Walking Ballista",
    cards: ["Heliod, Sun-Crowned", "Walking Ballista"],
    effect: "Unendlich Schaden",
    how: "Lifelink + Schaden → Lebensgewinn → Marken → wiederholen"
  },
  {
    name: "Thassa's Oracle Combo",
    cards: ["Thassa's Oracle", "Demonic Consultation"],
    effect: "Sofortiger Sieg",
    how: "Deck exilen → Oracle spielen → gewinnen"
  },
  {
    name: "Devoted Druid Combo",
    cards: ["Devoted Druid", "Vizier of Remedies"],
    effect: "Unendlich Mana",
    how: "Tap → enttappen → repeat"
  }
];


// 🔎 AUTOCOMPLETE
document.getElementById("search").addEventListener("input", function() {

  const query = this.value;

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  document.getElementById("suggestions").innerHTML = "Lade...";

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
    .then(res => res.json())
    .then(data => {

      const box = document.getElementById("suggestions");
      box.innerHTML = "";

      if (!data.data) {
        box.innerHTML = "Keine Ergebnisse";
        return;
      }

      data.data.forEach(name => {

        const div = document.createElement("div");
        div.className = "suggestion";
        div.innerText = name;

        div.onclick = function() {
          document.getElementById("search").value = name;
          loadCard(name);
        };

        box.appendChild(div);
      });

    })
    .catch(() => {
      document.getElementById("suggestions").innerHTML = "Fehler";
    });
});


// 🎴 KARTE LADEN
function loadCard(name) {

  document.getElementById("result").innerHTML = "Lade Karte...";
  document.getElementById("combos").innerHTML = "";
  document.getElementById("suggestions").innerHTML = "";

  fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(name))
    .then(res => res.json())
    .then(card => {

      let image = "";
      if (card.image_uris && card.image_uris.normal) {
        image = card.image_uris.normal;
      } else if (card.card_faces && card.card_faces[0].image_uris) {
        image = card.card_faces[0].image_uris.normal;
      }

      let text = card.oracle_text ||
                 (card.card_faces && card.card_faces[0].oracle_text) ||
                 "Kein Text";

      document.getElementById("result").innerHTML =
        '<div class="card">' +
        (image ? '<img src="' + image + '" width="250"><br><br>' : '') +
        '<h2>' + card.name + '</h2>' +
        '<p>' + (card.type_line || '') + '</p>' +
        '<p style="white-space: pre-line;">' + text + '</p>' +
        '</div>';

      showCombos(card.name);
    })
    .catch(() => {
      document.getElementById("result").innerHTML = "Fehler beim Laden";
    });
}


// 🔥 COMBOS ANZEIGEN
function showCombos(cardName) {

  const found = combos.filter(c => c.cards.includes(cardName));

  const box = document.getElementById("combos");

  if (found.length === 0) {
    box.innerHTML = "<p>Keine Combos gefunden 😢</p>";
    return;
  }

  box.innerHTML = "<h2>Combos:</h2>";

  found.forEach(c => {
    box.innerHTML +=
      '<div class="combo">' +
      '<h3>' + c.name + '</h3>' +
      '<p><b>Karten:</b> ' + c.cards.join(", ") + '</p>' +
      '<p><b>Effekt:</b> ' + c.effect + '</p>' +
      '<p><b>So funktioniert es:</b> ' + c.how + '</p>' +
      '</div>';
  });
}

</script>

</body>
</html>
