<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Combo Finder</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #020617, #0f172a);
  color: white;
}

h1 {
  text-align: center;
  padding: 25px;
  font-size: 34px;
  background: linear-gradient(90deg, #22c55e, #4f46e5);
  -webkit-background-clip: text;
  color: transparent;
}

.search {
  text-align: center;
  margin: 10px;
}

input {
  padding: 12px;
  width: 260px;
  border-radius: 10px;
  border: none;
  background: #1e293b;
  color: white;
}

button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(90deg, #22c55e, #4f46e5);
  color: white;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
}

/* Recent cards */
#recent {
  display: flex;
  gap: 10px;
  padding: 10px;
  justify-content: center;
  overflow-x: auto;
}

#recent img {
  height: 80px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

#recent img:hover {
  transform: scale(1.1);
}

.container {
  max-width: 900px;
  margin: auto;
}

.card {
  display: flex;
  gap: 15px;
  background: rgba(30, 41, 59, 0.7);
  margin: 20px;
  padding: 20px;
  border-radius: 18px;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-6px);
}

.card img {
  width: 120px;
  border-radius: 10px;
}

.content {
  flex: 1;
}

h2 {
  margin-top: 0;
  color: #38bdf8;
}

.box {
  background: #020617;
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

.warning {
  color: #facc15;
  font-size: 12px;
}

.empty {
  text-align: center;
  color: #64748b;
}
</style>
</head>

<h1>🧙‍♂️ MTG Combo Finder</h1>

<div class="search">

</body>
</html>
