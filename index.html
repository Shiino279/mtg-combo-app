<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Card Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

input {
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
  margin-top: 10px;
}

#suggestions {
  width: 260px;
  margin: auto;
  background: #1e293b;
  border-radius: 8px;
}

.suggestion {
  padding: 8px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

.card {
  background: #1e293b;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}
</style>

</head>

<body>

<h1>🧙 MTG Card Finder</h1>

<input id="search" placeholder="Kartennamen..." oninput="autoComplete()">

<div id="suggestions"></div>
<div id="results"></div>

<script>

function autoComplete() {
  const query = document.getElementById("search").value;

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
    .then(res => res.json())
    .then(data => {
      const box = document.getElementById("suggestions");
      box.innerHTML = "";

      if (!data.data) return;

      data.data.forEach(name => {
        const div = document.createElement("div");
        div.className = "suggestion";
        div.innerText = name;

        div.onclick = function() {
          document.getElementById("search").value = name;
          searchCard(name);
        };

        box.appendChild(div);
      });
    });
}

function searchCard(name) {

  document.getElementById("suggestions").innerHTML = "";

  fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(name))
    .then(res => res.json())
    .then(card => {

      let image = card.image_uris?.normal ||
                  card.card_faces?.[0]?.image_uris?.normal || "";

      let text = card.oracle_text ||
                 card.card_faces?.[0]?.oracle_text ||
                 "Kein Text verfügbar";

      let type = card.type_line || "";

      document.getElementById("results").innerHTML = `
        <div class="card">
          ${image ? `<img src="${image}" width="h2>${card.name}</h2>
          <p>${type}</p>
          <p style="white-space: pre-line;">${text}</p>
        </div>
      `;
    })
    .catch(() => {
      document.getElementById("results").innerHTML =
        "<p style='color:red'>Fehler beim Laden 😢</p>";
    });
}

</script>

</body>
</html>
``
