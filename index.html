
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shiinos Combos</title>

<style>
body { margin:0; font-family:"Segoe UI",sans-serif; background:#020617; color:white; text-align:center; }
h1 { margin-top:40px; color:#f97316; }

.container { display:flex; justify-content:center; margin-top:60px; }

.card { width:300px; height:420px; perspective:1000px; cursor:pointer; }

.inner {
  width:100%; height:100%;
  transition:transform 0.8s;
  transform-style:preserve-3d;
  position:relative;
}

.card:hover .inner { transform: rotateY(180deg); }

.front,.back {
  position:absolute;
  width:100%; height:100%;
  border-radius:15px;
  overflow:hidden;
  backface-visibility:hidden;
}

.front img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.back {
  background:linear-gradient(135deg,#7c2d12,#1e293b);
  transform:rotateY(180deg);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.combo {
  background:#1e293b;
  margin:10px auto;
  padding:15px;
  border-radius:10px;
  max-width:600px;
  cursor:pointer;
}

.cardView {
  background:#1e293b;
  padding:20px;
  margin:20px;
  border-radius:10px;
  text-align:left;
}

.cardImages {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.cardImages img {
  width:160px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.6);
}

.arrow {
  font-size:28px;
  color:#f97316;
}

button {
  padding:10px;
  background:#f97316;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.mana {
  width:20px;
  vertical-align:middle;
}
</style>
</head>

<body>

<h1>🔥 Shiinos Combos 🔥</h1>

<div id="homePage" class="container">
  <div class="card" onclick="openDeck()">
    <div class="inner">
      <div class="front">
        <img src="azula.jpg" alt="Azula">
      </div>
      <div class="back">
        <h2>Azula Deck</h2>
        <p>Combos:</p>
        <h2 id="comboCount"></h2>
      </div>
    </div>
  </div>
</div>

<div id="comboPage" style="display:none;">
  <h1>Azula Combos</h1>
  <div id="comboList"></div>
  <br>
  <button onclick="goBack()">⬅ Zurück</button>
</div>

<div id="detailPage" style="display:none;">
  <h1 id="comboTitle"></h1>
  <div id="comboDetail"></div>
  <br>
  <button onclick="backToCombos()">⬅ Zurück</button>
</div>

<script>

const combos = [
  {
    name: "Hellkite + Sozin's Comet",
    cards: ["Hellkite Charger", "Sozin's Comet"],
    text: `
<b>Startzustand:</b><br>
- Hellkite Charger liegt im Spiel.<br>
- Sozin's Comet ist auf der Hand oder im Exil (wurde zuvor vorhergesagt).<br><br>

<b>Voraussetzungen:</b><br>
- Du kontrollierst eine weitere Kreatur, die angreifen kann.<br>
- Ein Gegner kann deine Kreaturen nicht blocken.<br><br>

<b>Benötigtes Mana:</b><br>
<img class="mana" src="https://svgs.scryfall.io/card-symbols/3.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"><br><br>

<div class="steps">
<b>Ablauf:</b>
<ol>
<li>Wirke Sozin's Comet aus der Hand ({3}{R}{R}) oder aus dem Exil ({2}{R}).</li>
<li>Alle deine Kreaturen erhalten Firebending 5 bis zum Ende des Zuges.</li>
<li>Greife mit Hellkite Charger und mindestens einer weiteren Kreatur an.</li>
<li>Jede Firebending-Fähigkeit wird ausgelöst und erzeugt mehrfach rotes Mana.</li>
<li>Zahle <img class="mana" src="https://svgs.scryfall.io/card-symbols/5.svg"> <img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"> <img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"> , um Hellkite Charger zu aktivieren.</li>
<li>Alle angreifenden Kreaturen werden enttappt und du erhältst eine zusätzliche Kampfphase.</li>
<li>Wiederhole ab Schritt 3 in jeder weiteren Combat Phase.</li>
</ol>
</div>

<b>Ergebnis:</b><br>
- Unendlich viele Kampfphasen<br>
- Unendlich rotes Mana<br>
- Unendlich Kampfschaden
`
  },

  {
    name: "Hellkite + Firebending Student",
    cards: ["Hellkite Charger", "Firebending Student"],
    text: `
<b>Startzustand:</b><br>
- Hellkite Charger und Firebending Student liegen im Spiel.<br>
- Firebending Student hat keine Summoning Sickness und mindestens Stärke 7.<br><br>

<b>Voraussetzungen:</b><br>
- Ein Gegner kann deine Kreaturen nicht blocken.<br><br>

<div class="steps">
<b>Ablauf:</b>
<ol>
<li>Greife mit Hellkite Charger und Firebending Student an.</li>
<li>Beide Fähigkeiten werden ausgelöst.</li>
<li>Firebending Student erzeugt rotes Mana entsprechend seiner Stärke.</li>
<li>Zahle <img class="mana" src="https://svgs.scryfall.io/card-symbols/5.svg"> <img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"> <img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"> , um Hellkite Charger zu aktivieren.</li>
<li>Alle angreifenden Kreaturen werden enttappt und du erhältst eine zusätzliche Kampfphase.</li>
<li>Wiederhole jede Combat Phase.</li>
</ol>
</div>

<b>Ergebnis:</b><br>
- Unendlich viele Kampfphasen<br>
- Unendlich rotes Mana<br>
- Unendlich Kampfschaden
`
  }
];

document.getElementById("comboCount").innerText = combos.length;

function openDeck() {
  document.getElementById("homePage").style.display = "none";
  document.getElementById("comboPage").style.display = "block";

  const list = document.getElementById("comboList");
  list.innerHTML = "";

  combos.forEach((c, index) => {
    list.innerHTML += `<div class="combo" onclick="openCombo(${index})"><h3>${c.name}</h3></div>`;
  });
}

function openCombo(index) {
  const combo = combos[index];

  document.getElementById("comboPage").style.display = "none";
  document.getElementById("detailPage").style.display = "block";

  document.getElementById("comboTitle").innerText = combo.name;

  let cardsHTML = "";

  combo.cards.forEach((card, i) => {
    const imageURL = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card)}&format=image`;

    cardsHTML += `<img src="${imageURL}">`;

    if (i < combo.cards.length - 1) {
      cardsHTML += `<span class="arrow">➜</span>`;
    }
  });

  document.getElementById("comboDetail").innerHTML = `
    <div class="cardView">
      <h3>Karten:</h3>
      <div class="cardImages">${cardsHTML}</div>
      <br>
      <h3>Beschreibung:</h3>
      <p>${combo.text}</p>
    </div>
  `;
}

function goBack() {
  document.getElementById("homePage").style.display = "flex";
  document.getElementById("comboPage").style.display = "none";
}

function backToCombos() {
  document.getElementById("detailPage").style.display = "none";
  document.getElementById("comboPage").style.display = "block";
}

</script>

</body>
</html>
