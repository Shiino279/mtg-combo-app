<script>

// 🔎 AUTOCOMPLETE
function autoComplete() {
  const query = document.getElementById("search").value;

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
    .then(res => res.json())
    .then(data => {
      const box = document.getElementById("suggestions");
      box.innerHTML = "";

      if (!data.data) return;

      data.data.forEach(name => {
        const div = document.createElement("div");
        div.className = "suggestion";
        div.innerText = name;

        div.onclick = function() {
          document.getElementById("search").value = name;
          searchCard(name);
        };

        box.appendChild(div);
      });
    })
    .catch(err => {
      console.log("Autocomplete Fehler:", err);
    });
}


// 🎴 KARTE LADEN (FIXED VERSION)
function searchCard(name) {

  // Liste schließen
  document.getElementById("suggestions").innerHTML = "";

  fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(name))
    .then(res => res.json())
    .then(card => {

      const results = document.getElementById("results");

      // FALLBACKS (wichtig!)
      let image = "";
      if (card.image_uris && card.image_uris.normal) {
        image = card.image_uris.normal;
      } else if (card.card_faces && card.card_faces[0].image_uris) {
        image = card.card_faces[0].image_uris.normal;
      }

      let text = card.oracle_text || 
                 (card.card_faces && card.card_faces[0].oracle_text) ||
                 "Kein Text vorhanden";

      results.innerHTML = `
        <div class="card">
          ${image ? `<img src="${image}" width         <h2>${card.name}</h2>
          <p>${card.type_line || ""}</p>
          <p>${text}</p>
        </div>
      `;
    })
    .catch(err => {
      console.log("Fehler:", err);
      document.getElementById("results").innerHTML =
        "<p style='color:red'>Karte konnte nicht geladen werden 😢</p>";
    });
}

</script>
