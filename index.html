<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shiinos Combis</title>

<style>
body { margin:0; font-family:"Segoe UI",sans-serif; background:#020617; color:white; text-align:center; }
h1 { margin-top:40px; color:#f97316; }

.container { display:flex; justify-content:center; margin-top:60px; }

.card { width:300px; height:420px; perspective:1000px; cursor:pointer; }

.inner {
  width:100%; height:100%;
  transition:transform 0.8s;
  transform-style:preserve-3d;
  position:relative;
}

.card:hover .inner { transform: rotateY(180deg); }

.front,.back {
  position:absolute;
  width:100%; height:100%;
  border-radius:15px;
  overflow:hidden;
  backface-visibility:hidden;
}

.front img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.back {
  background:linear-gradient(135deg,#7c2d12,#1e293b);
  transform:rotateY(180deg);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.combo {
  background:#1e293b;
  margin:10px auto;
  padding:15px;
  border-radius:10px;
  max-width:600px;
  cursor:pointer;
}

.cardView {
  background:#1e293b;
  padding:20px;
  margin:20px;
  border-radius:10px;
  text-align:left;
}

.cardImages {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.cardImages img {
  width:160px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,0.6);
}

.arrow {
  font-size:28px;
  color:#f97316;
}

button {
  padding:10px;
  background:#f97316;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.mana {
  width:20px;
  vertical-align:middle;
}
</style>
</head>

<body>

<h1>🔥 Shiinos Combis 🔥</h1>

<div id="homePage" class="container">
  <div class="card" onclick="openDeck()">
    <div class="inner">
      <div class="front">
        <img src="azula.jpg" alt="Azula">
      </div>
      <div class="back">
        <h2>Azula Deck</h2>
        <p>Combos:</p>
        <h2 id="comboCount"></h2>
      </div>
    </div>
  </div>
</div>

<div id="comboPage" style="display:none;">
  <h1>Azula Combos</h1>
  <div id="comboList"></div>
  <br>
  <button onclick="goBack()">⬅ Zurück</button>
</div>

<div id="detailPage" style="display:none;">
  <h1 id="comboTitle"></h1>
  <div id="comboDetail"></div>
  <br>
  <button onclick="backToCombos()">⬅ Zurück</button>
</div>

<script>

const combos = [

{
name: "Hellkite + Sozin's Comet",
cards: ["Hellkite Charger","Sozin's Comet"],
text: `
<b>Startzustand:</b><br>
- Hellkite Charger im Spiel.<br>
- Sozin's Comet auf der Hand oder im Exil (Foretell).<br><br>

<b>Voraussetzungen:</b><br>
- Weitere Kreatur kann angreifen.<br>
- Gegner kann nicht blocken.<br><br>

<b>Mana:</b><br>
<img class="mana" src="https://svgs.scryfall.io/card-symbols/3.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"><br><br>

<div class="steps">
<b>Ablauf:</b>
<ol>
<li>Wirke Sozin's Comet.</li>
<li>Alle Kreaturen erhalten Firebending 5.</li>
<li>Greife mit mehreren Kreaturen an.</li>
<li>Erzeuge rotes Mana.</li>
<li>Zahle 
<img class="mana" src="https://svgs.scryfall.io/card-symbols/5.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg">
für Hellkite Charger.</li>
<li>Neue Combat Phase.</li>
<li>Wiederhole.</li>
</ol>
</div>

<b>Ergebnis:</b><br>
- Unendlich Combat Phasen<br>
- Unendlich rotes Mana<br>
- Unendlich Schaden
`
},

{
name:"Hellkite + Firebending Student",
cards:["Hellkite Charger","Firebending Student"],
text:`
<b>Startzustand:</b><br>
- Beide Kreaturen im Spiel.<br>
- Student ≥7 Stärke, keine Summoning Sickness.<br><br>

<b>Voraussetzungen:</b><br>
- Gegner kann nicht blocken.<br><br>

<div class="steps">
<b>Ablauf:</b>
<ol>
<li>Greife mit beiden an.</li>
<li>Trigger gehen auf Stack.</li>
<li>Student erzeugt Mana.</li>
<li>Zahle Kosten für Hellkite.</li>
<li>Neue Combat Phase.</li>
<li>Wiederhole.</li>
</ol>
</div>

<b>Ergebnis:</b><br>
- Unendlich Combat Phasen<br>
- Unendlich Mana<br>
- Unendlich Schaden
`
},

{
name:"Overkill + Jaws of Defeat",
cards:["Overkill","Jaws of Defeat"],
text:`
<b>Startzustand:</b><br>
- Overkill auf der Hand.<br>
- Jaws of Defeat im Spiel.<br><br>

<b>Voraussetzungen:</b><br>
- Du kannst eine Kreatur ins Spiel bringen.<br><br>

<b>Mana:</b><br>
<img class="mana" src="https://svgs.scryfall.io/card-symbols/2.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/B.svg"><br><br>

<div class="steps">
<b>Ablauf:</b>
<ol>
<li>Kreatur kommt ins Spiel → Trigger.</li>
<li>Wirke Overkill ({2}{B}).</li>
<li>Kreatur bekommt -0/-9999.</li>
<li>Kreatur stirbt.</li>
<li>Trigger resolved.</li>
<li>Gegner verliert extrem viel Leben.</li>
</ol>
</div>

<b>Ergebnis:</b><br>
- Gegner verliert das Spiel<br>
- Nahezu unendlich Lifedrain
`
}

];

document.getElementById("comboCount").innerText = combos.length;

function openDeck(){
document.getElementById("homePage").style.display="none";
document.getElementById("comboPage").style.display="block";

let list=document.getElementById("comboList");
list.innerHTML="";

combos.forEach((c,i)=>{
list.innerHTML+=`<div class="combo" onclick="openCombo(${i})"><h3>${c.name}</h3></div>`;
});
}

function openCombo(i){
let c=combos[i];

document.getElementById("comboPage").style.display="none";
document.getElementById("detailPage").style.display="block";

document.getElementById("comboTitle").innerText=c.name;

let cardsHTML="";

c.cards.forEach((card,index)=>{
let img=`https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card)}&format=image`;
cardsHTML+=`if(index<c.cards.length-1){
cardsHTML+=`<span class="arrow">➜</span>`;
}
});

document.getElementById("comboDetail").innerHTML=
`<div class="cardView">
<div class="cardImages">${cardsHTML}</div><br>
${c.text}
</div>`;
}

function goBack(){
document.getElementById("homePage").style.display="flex";
document.getElementById("comboPage").style.display="none";
}

function backToCombos(){
document.getElementById("detailPage").style.display="none";
document.getElementById("comboPage").style.display="block";
}

</script>

</body>
</html>
