<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shiinos Combis</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #020617;
  color: white;
  text-align: center;
}

/* Titel */
h1 {
  margin-top: 40px;
  color: #f97316;
}

/* Container */
.container {
  margin-top: 50px;
}

/* Karte */
.card {
  width: 300px;
  margin: auto;
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 15px;
  transition: 0.3s;
}

.card:hover img {
  transform: scale(1.05);
  box-shadow: 0 0 25px orange;
}

/* Combos Bereich */
#comboPage {
  display: none;
  padding: 20px;
}

.combo {
  background: #1e293b;
  margin: 15px auto;
  padding: 15px;
  border-radius: 10px;
  max-width: 600px;
  border: 1px solid #334155;
}
</style>

</head>

<body>

<h1>🔥 Shiinos Combis 🔥</h1>

<!-- STARTSEITE -->
<div id="homePage" class="container">

  <div class="card" onclick="openDeck()">
    
    <!-- ✅ DEIN LOKALES BILD -->
    <img src="azula.jpg">

  </div>

  <p>Klick auf dein Deck</p>

</div>


<!-- ✅ COMBO SEITE -->
<div id="comboPage">

  <h1>🔥 Azula Deck Combos 🔥</h1>

  <div id="comboList"></div>

  <br>
  <button onclick="goBack()">⬅ Zurück</button>

</div>


<script>

// ✅ DEINE COMBOS
const combos = [
  {
    name: "Heliod + Walking Ballista",
    text: "Unendlich Schaden durch Lifegain Loop"
  },
  {
    name: "Thassa's Oracle + Consultation",
    text: "Sofortiger Sieg"
  },
  {
    name: "Devoted Druid + Vizier",
    text: "Unendlich Mana"
  }
];


// 👉 Klick auf Karte
function openDeck() {

  document.getElementById("homePage").style.display = "none";
  document.getElementById("comboPage").style.display = "block";

  const list = document.getElementById("comboList");
  list.innerHTML = "";

  combos.forEach(c => {
    list.innerHTML += `
      <div class="combo">
        <h3>${c.name}</h3>
        <p>${c.text}</p>
      </div>
    `;
  });
}


// 👉 Zurück
function goBack() {
  document.getElementById("homePage").style.display = "block";
  document.getElementById("comboPage").style.display = "none";
}

</script>

</body>
</html>
