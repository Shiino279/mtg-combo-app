<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shiinos Combis</title>

<style>
body { margin:0; font-family:"Segoe UI",sans-serif; background:#020617; color:white; text-align:center; }
h1 { margin-top:40px; color:#f97316; }

.container { display:flex; justify-content:center; margin-top:60px; }

.card {
  width:300px;
  height:420px;
  perspective:1000px;
  cursor:pointer;
}

.inner {
  width:100%; height:100%;
  transition:transform 0.8s;
  transform-style:preserve-3d;
  position:relative;
}

.card:hover .inner { transform: rotateY(180deg); }

.front,.back {
  position:absolute;
  width:100%; height:100%;
  border-radius:15px;
  overflow:hidden;
  backface-visibility:hidden;
}

.front img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.back {
  background:linear-gradient(135deg,#7c2d12,#1e293b);
  transform:rotateY(180deg);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.combo {
  background:#1e293b;
  margin:10px auto;
  padding:15px;
  border-radius:10px;
  max-width:600px;
  cursor:pointer;
}

.cardView {
  background:#1e293b;
  padding:20px;
  margin:20px;
  border-radius:10px;
  text-align:left;
}

/* Animation */
.cardImages { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }

.cardImages img {
  width:140px;
  border-radius:10px;
  opacity:0;
  transform:translateY(20px);
  animation:fadeInUp 0.6s forwards;
}

.cardImages img:nth-child(1) { animation-delay:0.2s; }
.cardImages img:nth-child(3) { animation-delay:0.6s; }

@keyframes fadeInUp {
  to { opacity:1; transform:translateY(0); }
}

.arrow {
  font-size:28px;
  color:#f97316;
  opacity:0;
  animation:arrowPulse 1s infinite alternate, fadeIn 0.5s forwards;
}

@keyframes arrowPulse {
  from { transform:scale(1); opacity:0.6; }
  to { transform:scale(1.2); opacity:1; }
}

@keyframes fadeIn {
  to { opacity:1; }
}

button {
  padding:10px;
  background:#f97316;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.mana {
  width:20px;
  vertical-align:middle;
}
</style>
</head>

<body>

<h1>🔥 Shiinos Combis 🔥</h1>

<div id="homePage" class="container">
  <div class="card" onclick="openDeck()">
    <div class="inner">

      <!-- ✅ FIXED IMAGE -->
      <div class="front">
        <img src="azula.jpg">
      </div>

      <div class="back">
        <h2>Azula Deck</h2>
        <p>Combos:</p>
        <h2 id="comboCount"></h2>
      </div>
    </div>
  </div>
</div>

<div id="comboPage" style="display:none;">
  <h1>Azula Combos</h1>
  <div id="comboList"></div>
  <br>
  <button onclick="goBack()">⬅ Zurück</button>
</div>

<div id="detailPage" style="display:none;">
  <h1 id="comboTitle"></h1>
  <div id="comboDetail"></div>
  <br>
  <button onclick="backToCombos()">⬅ Zurück</button>
</div>

document.getElementById("comboCount").innerText = combos.length;

function openDeck() {
  document.getElementById("homePage").style.display = "none";
  document.getElementById("comboPage").style.display = "block";

  const list = document.getElementById("comboList");
  list.innerHTML = "";

  combos.forEach((c, index) => {
    list.innerHTML += `<div class="combo" onclick="openCombo(${index})"><h3>${c.name}</h3></div>`;
  });
}

function openCombo(index) {
  const combo = combos[index];

  document.getElementById("comboPage").style.display = "none";
  document.getElementById("detailPage").style.display = "block";

  document.getElementById("comboTitle").innerText = combo.name;

  let cardsHTML = "";

  combo.cards.forEach((card, i) => {
    const imageURL = `https://api.scryfall.com/cards/named?exact=${encodeURIComponent(card)}&format=image`;

    cardsmageURL}`;

    if (i < combo.cards.length - 1) {
      cardsHTML += `<span class="arrow">➜</span>`;
    }
  });

  document.getElementById("comboDetail").innerHTML = `
    <div class="cardView">
      <h3>Karten:</h3>
      <div class="cardImages">${cardsHTML}</div>
      <br>
      <h3>Beschreibung:</h3>
      <p>${combo.text}</p>
    </div>
  `;
}

function goBack() {
  document.getElementById("homePage").style.display = "flex";
  document.getElementById("comboPage").style.display = "none";
}

function backToCombos() {
  document.getElementById("detailPage").style.display = "none";
  document.getElementById("comboPage").style.display = "block";
}

</script>

</body>
</html>
