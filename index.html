
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Combo Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

input {
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

/* Vorschläge */
#suggestions {
  width: 260px;
  margin: auto;
  background: #1e293b;
  border-radius: 8px;
}

.suggestion {
  padding: 10px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

/* Karte */
.card {
  background: #1e293b;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}

/* Combos */
.combo {
  background: #1e293b;
  margin: 10px auto;
  padding: 12px;
  border-radius: 10px;
  max-width: 500px;
  border: 1px solid #334155;
}
</style>

</head>

<body>

<h1>🧙 MTG Combo Finder</h1>

<input id="search" placeholder="Kartennamen eingeben...">

<div id="suggestions"></div>
<div id="results"></div>
<div id="combos"></div>

<script>

document.addEventListener("DOMContentLoaded", function () {

  const input = document.getElementById("search");
  const suggestions = document.getElementById("suggestions");

  console.log("✅ Script gestartet");

  input.addEventListener("input", function () {

    let query = input.value;
    console.log("👉 Eingabe:", query);

    // Reset
    suggestions.innerHTML = "";

    if (query.length < 2) return;

    // ✅ TEST-Anzeige (damit du SIEHST, dass es läuft)
    suggestions.innerHTML = "<p>Lade Vorschläge...</p>";

    fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
      .then(function (res) {
        console.log("✅ Antwort erhalten");
        return res.json();
      })
      .then(function (data) {

        console.log("✅ Daten:", data);

        suggestions.innerHTML = "";

        if (!data || !data.data || data.data.length === 0) {
          suggestions.innerHTML = "<p>Keine Ergebnisse</p>";
          return;
        }

        data.data.forEach(function (name) {

          let div = document.createElement("div");
          div.className = "suggestion";
          div.innerText = name;

          div.onclick = function () {
            input.value = name;
            loadCard(name);
          };

          suggestions.appendChild(div);
        });

      })
      .catch(function (err) {

        console.log("❌ API Fehler:", err);

        // ✅ FALLBACK (wichtig)
        suggestions.innerHTML = "<p style='color:red'>API Fehler – check Internet</p>";
      });

  });


  // 🎴 Karte laden
  function loadCard(name) {

    const results = document.getElementById("results");

    results.innerHTML = "<p>Lade Karte...</p>";

    fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(name))
      .then(res => res.json())
      .then(card => {

        let image =
          (card.image_uris && card.image_uris.normal) ||
          (card.card_faces && card.card_faces[0]?.image_uris?.normal) || "";

        let text =
          card.oracle_text ||
          (card.card_faces && card.card_faces[0]?.oracle_text) ||
          "Kein Text";

        results.innerHTML = `
          <div class="card">
            ${image ? `<img src="${image}" width           <h2>${card.name}</h2>
            <p>${card.type_line || ""}</p>
            <p style="white-space: pre-line;">${text}</p>
          </div>
        `;
      })
      .catch(() => {
        results.innerHTML = "<p>Fehler beim Laden</p>";
      });

  }

});

</script>

</body>
</html>
