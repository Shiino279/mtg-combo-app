<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Card Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

input {
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

/* Vorschläge */
#suggestions {
  width: 260px;
  margin: auto;
  background: #1e293b;
  border-radius: 8px;
}

.suggestion {
  padding: 10px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

/* Ergebnis */
.card {
  background: #1e293b;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}
</style>

</head>

<body>

<h1>🧙 MTG Card Finder</h1>

<input id="search" placeholder="Kartennamen...">

<div id="suggestions"></div>
<div id="results"></div>

<script>

console.log("Script läuft ✅");

/* 🔎 AUTOCOMPLETE */
document.getElementById("search").addEventListener("input", function() {
  let query = this.value;

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
    .then(function(res) { return res.json(); })
    .then(function(data) {

      let box = document.getElementById("suggestions");
      box.innerHTML = "";

      if (!data || !data.data) return;

      for (let i = 0; i < data.data.length; i++) {

        let name = data.data[i];

        let div = document.createElement("div");
        div.className = "suggestion";
        div.innerText = name;

        div.onclick = function() {
          loadCard(name);
        };

        box.appendChild(div);
      }

    })
    .catch(function(err) {
      console.log("Autocomplete Fehler:", err);
    });
});

      }

          ${image ? `<img src="${image}" width="ein Bild</p>"}
