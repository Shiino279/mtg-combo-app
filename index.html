<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Combo Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

input {
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

/* Vorschläge */
#suggestions {
  width: 260px;
  margin: auto;
  background: #1e293b;
  border-radius: 8px;
}

.suggestion {
  padding: 10px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

/* Karte */
.card {
  background: #1e293b;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}

/* Combos */
.combo {
  background: #1e293b;
  margin: 10px auto;
  padding: 12px;
  border-radius: 10px;
  max-width: 500px;
  border: 1px solid #334155;
}
</style>

</head>

<body>

<h1>🧙 MTG Combo Finder</h1>

<input id="search" placeholder="Kartennamen eingeben...">

<div id="suggestions"></div>
<div id="results"></div>
<div id="combos"></div>

<script>

document.addEventListener("DOMContentLoaded", function () {

  const input = document.getElementById("search");
  const suggestions = document.getElementById("suggestions");
  const results = document.getElementById("results");
  const comboBox = document.getElementById("combos");

  // ✅ COMBO DATENBANK
  const combos = [
    {
      name: "Heliod + Walking Ballista",
      cards: ["Heliod, Sun-Crowned", "Walking Ballista"],
      effect: "Unendlicher Schaden",
      how: "Gib Lifelink → Schaden → Leben → Marken → wiederholen"
    },
    {
      name: "Thassa's Oracle Combo",
      cards: ["Thassa's Oracle", "Demonic Consultation"],
      effect: "Sofortiger Sieg",
      how: "Deck exilen → Oracle spielen → gewinnen"
    },
    {
      name: "Devoted Druid Combo",
      cards: ["Devoted Druid", "Vizier of Remedies"],
      effect: "Unendlich Mana",
      how: "Tap → enttappen → repeat"
    }
  ];

  // 🔎 AUTOCOMPLETE
  input.addEventListener("input", function () {

    const query = input.value;

    if (query.length < 2) {
      suggestions.innerHTML = "";
      return;
    }

    fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
      .then(res => res.json())
      .then(data => {

        suggestions.innerHTML = "";

        if (!data.data) return;

        data.data.forEach(name => {

          const div = document.createElement("div");
          div.className = "suggestion";
          div.innerText = name;

          // ✅ FIX: setzt Input + lädt Karte
          div.onclick = function () {
            input.value = name;
            loadCard(name);
          };

          suggestions.appendChild(div);
        });

      })
      .catch(() => {
        suggestions.innerHTML = "<p>Fehler</p>";
      });
  });


  // 🎴 KARTE LADEN
  function loadCard(name) {

    results.innerHTML = "<p>Lade Karte...</p>";
    comboBox.innerHTML = "";
    suggestions.innerHTML = "";

    fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(name))
      .then(res => res.json())
      .then(card => {

        let image = card.image_uris?.normal ||
                    card.card_faces?.[0]?.image_uris?.normal || "";

        let text = card.oracle_text ||
                   card.card_faces?.[0]?.oracle_text ||
                   "Kein Text verfügbar";

        let type = card.type_line || "";

        results.innerHTML = `
          <div class="card">
            ${image ? `<img src="${image}" width="250      <h2>${card.name}</h2>
            <p>${type}</p>
            <p style="white-space: pre-line;">${text}</p>
          </div>
        `;

        showCombos(card.name);
      })
      .catch(() => {
        results.innerHTML = "<p>Fehler beim Laden</p>";
      });
  }

  // 🔥 COMBOS ANZEIGEN
  function showCombos(cardName) {

    const matches = combos.filter(c => c.cards.includes(cardName));

    if (matches.length === 0) {
      comboBox.innerHTML = "<p>Keine Combos gefunden 😢</p>";
      return;
    }

    comboBox.innerHTML = "<h2>Combos:</h2>";

    matches.forEach(c => {
      comboBox.innerHTML += `
        <div class="combo">
          <h3>${c.name}</h3>
          <p><b>Karten:</b> ${c.cards.join(", ")}</p>
          <p><b>Effekt:</b> ${c.effect}</p>
          <p><b>So funktioniert es:</b> ${c.how}</p>
        </div>
      `;
    });
  }

});

</script>

</body>
</html>
