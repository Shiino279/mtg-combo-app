<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Card Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

input {
  padding: 10px;
  width: 250px;
  border-radius: 8px;
  border: none;
}

#suggestions {
  width: 250px;
  margin: auto;
  background: #1e293b;
  border-radius: 8px;
}

.suggestion {
  padding: 8px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

.card {
  background: #1e293b;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}
</style>
</head>

<body>

<h1>🧙 MTG Card Finder</h1>

<input id="search" placeholder="Kartennamen eingeben..." oninput="autoComplete()">

<div id="suggestions"></div>
<div id="results"></div>

<script>

// AUTOCOMPLETE
function autoComplete() {
  const query = document.getElementById("search").value;

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + query)
    .then(res => res.json())
    .then(data => {
      const box = document.getElementById("suggestions");
      box.innerHTML = "";

      data.data.forEach(name => {
        const div = document.createElement("div");
        div.className = "suggestion";
        div.innerText = name;

        div.onclick = () => {
          searchCard(name);
        };

        box.appendChild(div);
      });
    });
}

// KARTENSUCHE
function searchCard(name) {
  document.getElementById("suggestions").innerHTML = "";

  fetch("https://api.scryfall.com/cards/named?fuzzy=" + name)
    .then(res => res.json())
    .then(card => {

      let image = "";
      if (card.image_uris) {
        image = card.image_uris.normal;
      }

      document.getElementById("results").innerHTML = `
        <div class="card">
          <img src="${image}" width="250>${card.name}</h2>
          <p>${card.type_line || ""}</p>
          <p>${card.oracle_text || ""}</p>
        </div>
      `;
    });
}

</script>

</body>
</html>
