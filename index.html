<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shiinos Combis</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #020617, #0f172a);
  color: white;
  text-align: center;
}

h1 {
  margin-top: 40px;
  font-size: 40px;
  color: #f97316;
}

/* Card Container */
.container {
  display: flex;
  justify-content: center;
  margin-top: 60px;
}

.card {
  width: 300px;
  height: 420px;
  perspective: 1000px;
}

/* Flip Animation */
.inner {
  width: 100%;
  height: 100%;
  transition: transform 0.8s;
  transform-style: preserve-3d;
  position: relative;
}

.card:hover .inner {
  transform: rotateY(180deg);
}

/* Vorder + Rückseite */
.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 15px;
  overflow: hidden;
  backface-visibility: hidden;
}

/* Vorderseite */
.front img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Rückseite */
.back {
  background: linear-gradient(135deg, #7c2d12, #1e293b);
  transform: rotateY(180deg);

  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.back h2 {
  color: #f97316;
}

.back p {
  color: #e2e8f0;
}

/* Glow Effekt */
.card:hover {
  box-shadow: 0 0 25px rgba(249,115,22,0.7);
}
</style>

</head>

<body>

<h1>🔥 Shiinos Combis 🔥</h1>

<div class="container">

  <div class="card">
    <div class="inner">

      <!-- ✅ DEIN AZULA BILD -->
      <div class="front">
        <img src="azula.jpg">
      </div>

      <!-- Rückseite -->
      <div class="back">
        <h2>Azula Deck</h2>
        <p>Combos im Deck:</p>
        <h2>7</h2>
      </div>

    </div>
  </div>

</div>

</body>
</html>
