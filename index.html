<script>
// 💾 RECENT LADEN
let recentCards = JSON.parse(localStorage.getItem("recentCards")) || [];

// 🔁 RECENT
function addRecent(cardName) {
  recentCards = recentCards.filter(c => c !== cardName);
  recentCards.unshift(cardName);

  if (recentCards.length > 5) recentCards.pop();

  localStorage.setItem("recentCards", JSON.stringify(recentCards));
  renderRecent();
}

// 📺 RECENT anzeigen
function renderRecent() {
  let container = document.getElementById("recent");
  container.innerHTML = "";

  recentCards.forEach(card => {
    container.innerHTML += `
      <img src="https://api.scryfall.com/cards/named?exact=${card}&format=image"
      onclick="searchCard('${card}')tabil)
function autoComplete() {
  let query = document.getElementById("search").value;

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + query)
    .then(res => res.json())
    .then(data => {
      let suggestions = document.getElementById("suggestions");
      suggestions.innerHTML = "";

      if (!data.data) return;

      data.data.forEach(function(name) {
        suggestions.innerHTML += `
          <div class="suggestion" onclick="searchCard('${name}')">
            ${name}
          </div>
        `;
      });
    })
    .catch(() => {
      console.log("Autocomplete Fehler");
    });
}

// 🎴 KARTENSUCHE (fix)
function searchCard(cardName) {
  document.getElementById("suggestions").innerHTML = "";

  fetch("https://api.scryfall.com/cards/named?fuzzy=" + cardName)
    .then(res => res.json())
    .then(card => {

      let image = "";
      if (card.image_uris) {
        image = card.image_uris.normal;
      }

      document.getElementById("results").innerHTML = `
        <div class="card">
          <img src="${       <div class="content">
            <h2>${card.name}</h2>
            <p>${card.type_line || ""}</p>
            <p>${card.oracle_text || ""}</p>
          </div>
        </div>
      `;

      addRecent(card.name);
    })
    .catch(() => {
      document.getElementById("results").innerHTML =
        "<p class='empty'>Fehler beim Laden 😢</p>";
    });
}

// INIT
renderRecent();
</script>
