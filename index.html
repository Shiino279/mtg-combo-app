<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Combo Finder</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
}

h1 {
  text-align: center;
  padding: 20px;
}

/* Suche */
.search {
  text-align: center;
  margin: 20px;
}

input {
  padding: 10px;
  width: 250px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #22c55e;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #16a34a;
}

/* Karten */
.container {
  max-width: 800px;
  margin: auto;
}

.card {
  background: #1e293b;
  margin: 15px;
  padding: 15px;
  border-radius: 12px;
}

.box {
  background: #020617;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🧙 MTG Combo Finder</h1>

<div class="search">
  <input id="search" placeholder="Kartennamen eingeben">
  <button onclick="search()">Suchen</button>
</div>

<div class="container" id="results"></div>

<script>
const combos = [
  {
    name: "Heliod + Walking Ballista",
    cards: ["Heliod, Sun-Crowned", "Walking Ballista"],
    description: "Unendlicher Schaden",
    how: "Gib Lifelink → Damage → Life → Counter zurück",
    notes: "Mindestens 2 Marken"
  },
  {
    name: "Thassa's Oracle Combo",
    cards: ["Thassa's Oracle", "Demonic Consultation"],
    description: "Sofortiger Sieg",
    how: "Deck exilen → Oracle spielen",
    notes: "Timing beachten"
  }
];

function search() {
  var input = document.getElementById("search").value.toLowerCase();
  var results = document.getElementById("results");

  results.innerHTML = "";

  var filtered = combos.filter(function(c) {
    return c.cards.some(function(card) {
      return card.toLowerCase().includes(input);
    });
  });

  if (filtered.length === 0) {
    results.innerHTML = "<p>Keine Combos gefunden</p>";
    return;
  }

  filtered.forEach(function(c) {
    results.innerHTML += `
      <div class="card">
        <h2>${c.name}</h2>
        <p><b>Karten:</b> ${c.cards.join(", ")}</p>
        <p>${c.description}</p>

        <div class="box">
          <b>So funktioniert es:</b><br>
          ${c.how}
        </div>

        <p>⚠️ ${c.notes}</p>
      </div>
    `;
  });
}
</script>

</body>
</html>
``
