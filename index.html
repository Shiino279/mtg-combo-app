<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MTG Combo Finder</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    header {
      text-align: center;
      padding: 30px;
      font-size: 32px;
      font-weight: bold;
    }

    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 20px;
    }

    input {
      padding: 12px;
      border: none;
      border-radius: 8px;
      width: 250px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #16a34a;
      transform: scale(1.05);
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.8);
      margin-top: 20px;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    .title {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .label {
      color: #94a3b8;
      font-size: 14px;
    }

    .box {
      background: #1e293b;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .warning {
      color: #facc15;
      margin-top: 10px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      color: #94a3b8;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>🧙 MTG Combo Finder</header>

<div class="search-box">
  <input id="search" placeholder="Kartennamen eingeben..." />
  <button onclick="search()">Suchen</button>
</div>

<div class="container" id="results"></div>

<script>
const combos = [
  {
    name: "Heliod + Walking Ballista",
    cards: ["Heliod, Sun-Crowned", "Walking Ballista"],
    description: "Unendlicher Schaden",
    how: "Gib Lifelink → Schaden → Leben → Marke zurück → wiederholen",
    notes: "Mindestens 2 Marken nötig."
  },
  {
    name: "Thassa's Oracle Combo",
    cards: ["Thassa's Oracle", "Demonic Consultation"],
    description: "Sofortiger Sieg",
    how: "Deck exilen → Oracle spielen → gewinnen",
    notes: "Timing auf Stack beachten"
  }
];

function search() {
  const input = document.getElementById("search").value.toLowerCase();
  const results = document.getElementById("results");

  results.innerHTML = "";

  const filtered = combos.filter(c =>
    c.cards.some(card => card.toLowerCase().includes(input))
  );

  if (filtered.length === 0) {
    results.innerHTML = "<p class='empty'>Keine Combos gefunden 😢</p>";
    return;
  }

  filtered.forEach(c => {
    results.innerHTML += `
      <div class="card">
        <div class="title">${c.name}</div>
        <div class="label">Karten:</div>
        <div>${c.cards.join(", ")}</div>

        <div class="label">Beschreibung:</div>
        <div>${c.description}</div>

        <div class="box">
          <b>So funktioniert es:</b><br>
          ${c.how}
        </div>

        <div class="warning">⚠️ ${c.notes}</div>
      </div>
    `;
  });
}
</script>

</body>
</html>
``
