<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Card Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

input {
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

#suggestions {
  width: 260px;
  margin: auto;
  background: #1e293b;
  border-radius: 8px;
}

.suggestion {
  padding: 8px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

.card {
  background: #1e293b;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}
</style>

</head>
<body>

<h1>🧙 MTG Card Finder</h1>

<input id="search" placeholder="Kartennamen eingeben">

<br><br>
<button onclick="searchFromInput()">Suchen</button>

<div id="suggestions"></div>
<div id="results"></div>

<script>

// ✅ Button Suche
function searchFromInput() {
  let value = document.getElementById("search").value;
  if (value.length > 0) {
    searchCard(value);
  }
}

// ✅ Autocomplete beim Tippen
document.getElementById("search").addEventListener("input", function() {
  autoComplete(this.value);
});

function autoComplete(query) {

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
    .then(res => res.json())
    .then(data => {

      let suggestions = document.getElementById("suggestions");
      suggestions.innerHTML = "";

      if (!data.data) return;

      data.data.forEach(function(name) {

        let div = document.createElement("div");
        div.className = "suggestion";
        div.innerText = name;

        div.onclick = function() {
          document.getElementById("search").value = name;
          searchCard(name);
        };

        suggestions.appendChild(div);
      });

    })
    .catch(err => console.log("Autocomplete Fehler:", err));
}


// ✅ Karte laden (MIT DEBUG!)
function searchCard(name) {

  console.log("Suche Karte:", name);

  document.getElementById("suggestions").innerHTML = "";
  document.getElementById("results").innerHTML = "<p>Lade Karte...</p>";

  fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(name))
    .then(res => res.json())
    .then(card => {

      console.log("API Antwort:", card);

      let image = "";
      let text = "";
      let type = "";

      // ✅ Bild sicher holen
      if (card.image_uris && card.image_uris.normal) {
        image = card.image_uris.normal;
      } else if (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris) {
        image = card.card_faces[0].image_uris.normal;
      } else {
        image = "";
      }

      // ✅ Text sicher holen
      if (card.oracle_text) {
        text = card.oracle_text;
      } else if (card.card_faces && card.card_faces[0]) {
        text = card.card_faces[0].oracle_text || "";
      } else {
        text = "Kein Text verfügbar";
      }

      type = card.type_line || "";

      document.getElementById("results").innerHTML = `
        <div class="card">
          ${image ? `<img src="${image}" width="250 Bild</p>"}
          <h2>${card.name}</h2>
          <p>${type}</p>
          <p style="white-space: pre-line;">${text}</p>
        </div>
      `;
    })
    .catch(err => {
      console.log("FEHLER:", err);
      document.getElementById("results").innerHTML =
        "<p style='color:red'>❌ Fehler beim Laden der Karte</p>";
    });
}

</script>

</body>
</html>
``
