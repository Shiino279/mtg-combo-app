<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shiinos Combis</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #020617, #0f172a);
  color: white;
  text-align: center;
}

/* Titel */
h1 {
  margin-top: 40px;
  font-size: 40px;
  color: #f97316;
}

/* Container */
.container {
  display: flex;
  justify-content: center;
  margin-top: 60px;
}

/* FLIP CARD */
.card {
  width: 300px;
  height: 420px;
  perspective: 1000px;
  cursor: pointer;
}

.inner {
  width: 100%;
  height: 100%;
  transition: transform 0.8s;
  transform-style: preserve-3d;
  position: relative;
}

.card:hover .inner {
  transform: rotateY(180deg);
}

/* FRONT / BACK */
.front, .back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 15px;
  overflow: hidden;
  backface-visibility: hidden;
}

/* FRONT */
.front img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* BACK */
.back {
  background: linear-gradient(135deg, #7c2d12, #1e293b);
  transform: rotateY(180deg);

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.back h2 {
  color: #f97316;
}

/* Glow */
.card:hover {
  box-shadow: 0 0 25px rgba(249,115,22,0.7);
}

/* COMBO PAGE */
#comboPage {
  display: none;
  padding: 20px;
}

.combo {
  background: #1e293b;
  margin: 15px auto;
  padding: 15px;
  border-radius: 10px;
  max-width: 600px;
  border: 1px solid #334155;
}

button {
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #f97316;
  color: white;
  cursor: pointer;
}
</style>

</head>

<body>

<h1>🔥 Shiinos Combis 🔥</h1>

<!-- ✅ STARTSEITE -->
<div id="homePage" class="container">

  <div class="card" onclick="openDeck()">
    <div class="inner">

      <!-- ✅ FRONT -->
      <div class="front">
        <img src="azula.jpg">
      </div>

      <!-- ✅ BACK -->
      <div class="back">
        <h2>Azula Deck</h2>
        <p>Combos:</p>
        <h2 id="comboCount"></h2>
      </div>

    </div>
  </div>

</div>


<!-- ✅ COMBO SEITE -->
<div id="comboPage">

  <h1>🔥 Azula Combos 🔥</h1>

  <div id="comboList"></div>

  <br>
  <button onclick="goBack()">⬅ Zurück</button>

</div>


<script>

// ✅ DEINE COMBOS
const combos = [
  {
    name: "Heliod + Walking Ballista",
    text: "Unendlich Schaden"
  },
  {
    name: "Thassa's Oracle + Consultation",
    text: "Sofortiger Sieg"
  },
  {
    name: "Devoted Druid + Vizier",
    text: "Unendlich Mana"
  }
];


// ✅ ANZAHL AUF RÜCKSEITE SETZEN
document.getElementById("comboCount").innerText = combos.length;


// 👉 CLICK → DECK ÖFFNEN
function openDeck() {

  document.getElementById("homePage").style.display = "none";
  document.getElementById("comboPage").style.display = "block";

  const list = document.getElementById("comboList");
  list.innerHTML = "";

  combos.forEach(c => {
    list.innerHTML += `
      <div class="combo">
        <h3>${c.name}</h3>
        <p>${c.text}</p>
      </div>
    `;
  });
}


// 👉 ZURÜCK
function goBack() {
  document.getElementById("homePage").style.display = "flex";
  document.getElementById("comboPage").style.display = "none";
}

</script>

</body>
</html>
``
