<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>MTG Combo Finder</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

input {
  padding: 10px;
  width: 260px;
  border-radius: 8px;
  border: none;
}

/* Vorschläge */
#suggestions {
  width: 260px;
  margin: auto;
  background: #1e293b;
  border-radius: 8px;
}

.suggestion {
  padding: 10px;
  cursor: pointer;
}

.suggestion:hover {
  background: #334155;
}

/* Karte */
.card {
  background: #1e293b;
  margin: 20px auto;
  padding: 20px;
  border-radius: 12px;
  max-width: 500px;
}

/* Combos */
.combo {
  background: #1e293b;
  margin: 10px auto;
  padding: 12px;
  border-radius: 10px;
  max-width: 500px;
  border: 1px solid #334155;
}
</style>
</head>

<body>

<h1>🧙 MTG Combo Finder</h1>

<input id="search" placeholder="Karte eingeben...">
<div id="suggestions"></div>

<div id="results"></div>
<div id="combos"></div>

<script>

document.addEventListener("DOMContentLoaded", function () {

  const input = document.getElementById("search");
  const suggestions = document.getElementById("suggestions");
  const results = document.getElementById("results");
  const combosBox = document.getElementById("combos");

  // ✅ Combos
  const combos = [
    {
      name: "Heliod + Walking Ballista",
      cards: ["Heliod, Sun-Crowned", "Walking Ballista"],
      effect: "Unendlich Schaden",
      how: "Lifelink + Schaden → Lebensgewinn → Marken → repeat"
    },
    {
      name: "Thassa's Oracle Combo",
      cards: ["Thassa's Oracle", "Demonic Consultation"],
      effect: "Sofortiger Sieg",
      how: "Deck exilen → Oracle spielen → gewinnen"
    }
  ];

  // 🔎 AUTOCOMPLETE
  input.addEventListener("input", function () {

    const query = input.value;

    if (query.length < 2) {
      suggestions.innerHTML = "";
      return;
    }

    suggestions.innerHTML = "<p>Lade...</p>";

    fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
      .then(res => res.json())
      .then(data => {

        suggestions.innerHTML = "";

        if (!data || !data.data) {
          suggestions.innerHTML = "<p>Keine Ergebnisse</p>";
          return;
        }

        data.data.forEach(name => {

          const div = document.createElement("div");
          div.className = "suggestion";
          div.textContent = name;

          div.onclick = function () {
            input.value = name;
            loadCard(name);
          };

          suggestions.appendChild(div);
        });
      })
      .catch(err => {
        console.log(err);
        suggestions.innerHTML = "<p style='color:red'>API Fehler</p>";
      });
  });

  // 🎴 KARTE LADEN
  function loadCard(name) {

    results.innerHTML = "<p>Lade Karte...</p>";
    combosBox.innerHTML = "";
    suggestions.innerHTML = "";

    fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(name))
      .then(res => res.json())
      .then(card => {

        let image = card.image_uris?.normal ||
                    card.card_faces?.[0]?.image_uris?.normal ||
                    "";

        let text = card.oracle_text ||
                   card.card_faces?.[0]?.oracle_text ||
                   "Kein Text verfügbar";

        results.innerHTML = `
          <div class="card">
            ${image ? `<img src="${image}" width           <h2>${card.name}</h2>
            <p>${card.type_line || ""}</p>
            <p style="white-space: pre-line;">${text}</p>
          </div>
        `;

        showCombos(card.name);
      })
      .catch(() => {
        results.innerHTML = "<p>Fehler beim Laden</p>";
      });
  }

  // 🔥 COMBOS ANZEIGEN
  function showCombos(cardName) {

    const matches = combos.filter(c =>
      c.cards.includes(cardName)
    );

    if (matches.length === 0) {
      combosBox.innerHTML = "<p>Keine Combos gefunden 😢</p>";
      return;
    }

    combosBox.innerHTML = "<h2>Combos:</h2>";

    matches.forEach(c => {
      combosBox.innerHTML += `
        <div class="combo">
          <h3>${c.name}</h3>
          <p>${c.cards.join(", ")}</p>
          <p>${c.effect}</p>
          <p>${c.how}</p>
        </div>
      `;
    });
  }

});

</script>

</body>
</html>
