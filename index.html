
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Shiinos Combos</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#010409;
  color:white;
  text-align:center;
}

body::before {
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:radial-gradient(circle, rgba(255,255,255,0.03), transparent);
  animation:fog 20s linear infinite;
  pointer-events:none;
}

@keyframes fog {
  0% { transform:translate(0,0); }
  50% { transform:translate(-5%, -5%); }
  100% { transform:translate(0,0); }
}

h1 {
  color:#ff6a00;
  text-shadow:0 0 10px orange;
}

.card {
  width:300px;
  height:420px;
  margin:auto;
  cursor:pointer;
}

.card img {
  width:100%;
  border-radius:12px;
}

.combo {
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:10px;
  cursor:pointer;
}

.cardImages {
  display:flex;
  justify-content:center;
  gap:10px;
}

.cardImages img {
  width:150px;
  border-radius:10px;
}

.arrow {
  font-size:25px;
  color:orange;
}

button {
  margin-top:20px;
  padding:10px;
}

.mana { width:20px; }
</style>
</head>

<body>

<h1>🔥 Shiinos Combos 🔥</h1>

<div id="homePage">
  <div class="card" onclick="openDeck()">
    azula.jpg
  </div>
</div>

<div id="comboPage" style="display:none;">
  <h2>Combos</h2>
  <div id="comboList"></div>
  <button onclick="goBack()">⬅ zurück</button>
</div>

<div id="detailPage" style="display:none;">
  <h2 id="title"></h2>
  <div id="content"></div>
  <button onclick="back()">⬅ zurück</button>
</div>

<script>

const combos = [

{
name:"Hellkite + Sozin's Comet",
cards:["Hellkite Charger","Sozin's Comet"],
text:`
<b>Startzustand:</b><br>
- Hellkite Charger liegt im Spiel.<br>
- Sozin's Comet ist auf der Hand oder im Exil (vorhergesagt).<br><br>

<b>Voraussetzungen:</b><br>
- Du kontrollierst eine weitere Kreatur die angreifen kann.<br>
- Gegner kann deine Kreaturen nicht blocken.<br><br>

<b>Mana:</b><br>
<img class="mana" src="https://svgs.scryfall.io/card-symbols/3.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"><br><br>

<b>Ablauf:</b><br>
1. Wirke Sozin's Comet<br>
2. Kreaturen erhalten Firebending 5<br>
3. Greife mit mehreren Kreaturen an<br>
4. Erzeuge rotes Mana<br>
5. Zahle <img class="mana" src="https://svgs.scryfall.io/card-symbols/5.svg"> <img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"> <img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"><br>
6. Neue Combat Phase<br>
7. Wiederhole<br><br>

<b>Ergebnis:</b><br>
- Unendlich Combat Phasen<br>
- Unendlich rotes Mana<br>
- Unendlicher Schaden
`
},

{
name:"Hellkite + Firebending Student",
cards:["Hellkite Charger","Firebending Student"],
text:`
<b>Startzustand:</b><br>
- Beide Karten liegen im Spiel.<br>
- Firebending Student hat Stärke 7+ und keine Summoning Sickness.<br><br>

<b>Voraussetzungen:</b><br>
- Gegner kann nicht blocken.<br><br>

<b>Ablauf:</b><br>
1. Greife mit beiden Kreaturen an<br>
2. Beide Fähigkeiten triggern<br>
3. Student erzeugt rotes Mana<br>
4. Zahle <img class="mana" src="https://svgs.scryfall.io/card-symbols/5.svg"> <img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"> <img class="mana" src="https://svgs.scryfall.io/card-symbols/R.svg"><br>
5. Kreaturen enttappen + neue Combat Phase<br>
6. Wiederhole<br><br>

<b>Ergebnis:</b><br>
- Unendlich Combat Phasen<br>
- Unendlich rotes Mana<br>
- Unendlicher Schaden
`
},

{
name:"Overkill + Jaws of Defeat",
cards:["Overkill","Jaws of Defeat"],
text:`
<b>Startzustand:</b><br>
- Overkill ist auf der Hand.<br>
- Jaws of Defeat liegt im Spiel.<br><br>

<b>Voraussetzungen:</b><br>
- Du kannst eine Kreatur ins Spiel bringen.<br><br>

<b>Mana:</b><br>
<img class="mana" src="https://svgs.scryfall.io/card-symbols/2.svg">
<img class="mana" src="https://svgs.scryfall.io/card-symbols/B.svg"><br><br>

<b>Ablauf:</b><br>
1. Kreatur kommt ins Spiel (Trigger)<br>
2. Wirke Overkill ({2}{B})<br>
3. Kreatur bekommt -0/-9999<br>
4. Kreatur stirbt<br>
5. Jaws Trigger resolved<br>
6. Gegner verliert Leben entsprechend Differenz<br><br>

<b>Ergebnis:</b><br>
- Gegner verliert das Spiel<br>
- Extrem hoher Lifedrain
`
}

];

function openDeck(){
  document.getElementById("homePage").style.display="none";
  document.getElementById("comboPage").style.display="block";

  let list = document.getElementById("comboList");
  list.innerHTML="";

  combos.forEach((c,i)=>{
    let div = document.createElement("div");
    div.className="combo";
    div.innerText=c.name;
    div.onclick = () => openCombo(i);
    list.appendChild(div);
  });
}

function openCombo(i){
  let c = combos[i];

  document.getElementById("comboPage").style.display="none";
  document.getElementById("detailPage").style.display="block";

  document.getElementById("title").innerText = c.name;

  let html = "";

  c.cards.forEach((card,index)=>{
    let img = "https://api.scryfall.com/cards/named?exact=" 
              + encodeURIComponent(card) + "&format=image";

    html += "<img src='" + img + "'>";

    if(index < c.cards.length-1){
      html += "<span class='arrow'>➜</span>";
    }
  });

  html += "<p>" + c.text + "</p>";

  document.getElementById("content").innerHTML = html;
}

function goBack(){
  document.getElementById("homePage").style.display="block";
  document.getElementById("comboPage").style.display="none";
}

function back(){
  document.getElementById("detailPage").style.display="none";
  document.getElementById("comboPage").style.display="block";
}

</script>

</body>
</html>
