  border-radius: 12px;
  max-width: 500px;
}
</style>

</head>
<body>

<h1>🧙 MTG Card Finder</h1>

<input id="search" placeholder="Kartennamen...">

<div id="suggestions"></div>
<div id="results"></div>

<script>

// Debug
console.log("✅ Script läuft");

const input = document.getElementById("search");

// 🔎 AUTOCOMPLETE
input.addEventListener("input", function() {

  const query = input.value;

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  fetch("https://api.scryfall.com/cards/autocomplete?q=" + encodeURIComponent(query))
    .then(res => res.json())
    .then(data => {

      const box = document.getElementById("suggestions");
      box.innerHTML = "";

      if (!data.data) return;

      data.data.forEach(name => {

        const div = document.createElement("div");
        div.className = "suggestion";
        div.innerText = name;

        div.onclick = () => loadCard(name);

        box.appendChild(div);
      });

    })
    .catch(err => console.error("❌ Autocomplete Fehler:", err));
});


// 🎴 KARTE LADEN
function loadCard(name) {

  console.log("🎴 Lade Karte:", name);

  const results = document.getElementById("results");
  results.innerHTML = "<p>Lade Karte...</p>";

  fetch("https://api.scryfall.com/cards/named?fuzzy=" + encodeURIComponent(name))
    .then(res => res.json())
    .then(card => {

      let image = "";
      let text = "Kein Text verfügbar";
      let type = card.type_line || "";

      // ✅ Bild
      if (card.image_uris && card.image_uris.normal) {
        image = card.image_uris.normal;
      } else if (card.card_faces && card.card_faces[0]?.image_uris) {
        image = card.card_faces[0].image_uris.normal;
      }

      // ✅ Text
      if (card.oracle_text) {
        text = card.oracle_text;
      } else if (card.card_faces && card.card_faces[0]) {
        text = card.card_faces[0].oracle_text || text;
      }

      results.innerHTML = `
        <div class="card">
          ${image ? `<img src="${image}" width="250"><br><br>` : "<p>Kein Bild</p>"}
          <h2>${card.name}</h2>
          <p>${type}</p>
          <p style="white-space: pre-line;">${text}</p>
        </div>
      `;
    })
    .catch(err => {
      console.error("❌ Fehler beim Laden:", err);
      results.innerHTML = "<p>Fehler beim Laden</p>";
    });
}

</script>

</body>
</html>
