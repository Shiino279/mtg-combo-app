<script>
let recentCards = JSON.parse(localStorage.getItem("recentCards")) || [];

// 🔁 RECENT SYSTEM
function addRecent(cardName) {
  recentCards = recentCards.filter(c => c !== cardName);
  recentCards.unshift(cardName);

  if (recentCards.length > 5) recentCards.pop();

  localStorage.setItem("recentCards", JSON.stringify(recentCards));
  renderRecent();
}

function renderRecent() {
  const container = document.getElementById("recent");
  container.innerHTML = "";

  recentCards.forEach(card => {
    container.innerHTML += `
      <img src="https://api.scryfall.com/cards/named?exact=${card}&format=image"
      onclick="searchCard('${card function autoComplete() {
  const query = document.getElementById("search").value;

  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  try {
    const res = await fetch(`https://api.scryfall.com/cards/autocomplete?q=${query}`);
    const data = await res.json();

    const suggestions = document.getElementById("suggestions");
    suggestions.innerHTML = "";

    if (!data.data) return;

    data.data.forEach(name => {
      const item = document.createElement("div");
      item.className = "suggestion";
      item.innerText = name;
      item.onclick = () => searchCard(name);

      suggestions.appendChild(item);
    });

  } catch (err) {
    console.log("Fehler bei Autocomplete:", err);
  }
}

// 🎴 KARTEN LADEN FIX
async function searchCard(cardName) {
  document.getElementById("suggestions").innerHTML = "";

  try {
    const res = await fetch(`https://api.scryfall.com/cards/named?fuzzy=${cardName}`);
    const card = await res.json();

    const results = document.getElementById("results");

    // FALLBACK falls kein Bild existiert
    let image = card.image_uris ? card.image_uris.normal : "";

    results.innerHTML = `
      <div class="card">
        <img src="${image}"iv class="content">
          <h2>${card.name}</h2>
          <p>${card.type_line || ""}</p>
          <p>${card.oracle_text || ""}</p>
        </div>
      </div>
    `;

    addRecent(card.name);

  } catch (err) {
    document.getElementById("results").innerHTML =
      "<p class='empty'>Fehler beim Laden der Karte 😢</p>";
  }
}

// INIT
renderRecent();
</script>
``
